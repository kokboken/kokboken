<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kokboken</title>
<meta name="description" content="Familjens kokbok">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="ikon-192.png">
<link rel="apple-touch-icon" href="ikon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kokboken">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1C1612" id="themecolor">
<style>
  /* Mörkt är standard, som i appen. Appen meddelar när man byter läge. */
  :root { --bg: #1C1612; --ink: #F2E9DF; --muted: #B5A391; }
  :root[data-theme="light"] { --bg: #FAF6EF; --ink: #3A2A20; --muted: #7A6553; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  /* Appen ligger i en ram som täcker skärmen, men lämnar plats för klockan överst och hemstrecket nederst på iPhone. */
  /* På iPhone kan en ram växa till innehållets bredd. width: 1px och min-width: 100% håller den lika bred som skärmen.
     I liggande läge lämnas plats för kameran på sidorna. */
  iframe { position: fixed; left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px); top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); width: 1px; min-width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)); max-width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)); height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); border: 0; background: var(--bg); }
  .msg { max-width: 30em; margin: 0 auto; padding: 22vh 24px 24px; text-align: center; }
  .msg img { width: 88px; height: 88px; border-radius: 20px; }
  .msg h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 2rem; margin: 16px 0 8px; }
  .msg p { color: var(--muted); margin: 0; }
  /* Rutan "Lägg Kokboken på hemskärmen", visas tills man har lagt till appen eller stängt rutan. */
  .tips { position: fixed; left: 12px; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 10; display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; background: #B5482F; color: #fff; box-shadow: 0 8px 28px rgba(0,0,0,.35); font-size: .95rem; line-height: 1.4; }
  .tips img { width: 40px; height: 40px; border-radius: 10px; flex: none; }
  .tips div { flex: 1; }
  .tips strong { display: block; }
  .tips button { border: 0; border-radius: 99px; cursor: pointer; font: inherit; }
  .tips .go { background: #FAF6EF; color: #B5482F; font-weight: 700; padding: 8px 14px; }
  .tips .x { background: transparent; color: #fff; width: 32px; height: 32px; font-size: 1.1rem; flex: none; }
</style>
</head>
<body>
<script>
  /* Appens adresser hos Google. Med ?app=test används testappen. */
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    document.getElementById('themecolor').setAttribute('content', t === 'light' ? '#FAF6EF' : '#1C1612');
  }
  try { setTheme(localStorage.getItem('kokboken-tema')); } catch (e) { setTheme('dark'); }
  window.addEventListener('message', function (e) {
    var t = e.data && e.data.kokbokenTema;
    if (t !== 'light' && t !== 'dark') return;
    setTheme(t);
    try { localStorage.setItem('kokboken-tema', t); } catch (err) {}
  });
  /* Lägg på hemskärmen. Android (Chrome) kan visa sin egen fråga via beforeinstallprompt.
     iPhone tillåter inte det, så där visas en instruktion. Inget visas om appen redan körs från hemskärmen. */
  var installEvent = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installEvent = e; var t = document.getElementById('tips'); if (t) renderTip(t); });
  function standalone() { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }
  function isIOS() { return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
  function inAppBrowser() { return /FBAN|FBAV|Instagram|Messenger|Line\/|GSA\//.test(navigator.userAgent); }
  function renderTip(t) {
    var text, btn = '';
    if (inAppBrowser()) text = 'Öppna länken i Safari eller Chrome först, sedan kan du lägga Kokboken på hemskärmen.';
    else if (isIOS()) text = 'Tryck på Dela-ikonen <span aria-hidden="true">⬆︎</span> nedanför och välj <b>Lägg till på hemskärmen</b>.';
    else if (installEvent) { text = 'Få Kokboken som en app på telefonen.'; btn = '<button class="go" id="tipsGo">Installera</button>'; }
    else text = 'Öppna webbläsarens meny <span aria-hidden="true">⋮</span> och välj <b>Lägg till på startskärmen</b>.';
    t.innerHTML = '<img src="ikon-192.png" alt=""><div><strong>Lägg Kokboken på hemskärmen</strong>' + text + '</div>' + btn + '<button class="x" id="tipsX" aria-label="Stäng">✕</button>';
    document.getElementById('tipsX').onclick = function () { t.remove(); try { localStorage.setItem('kokboken-tips', 'stangd'); } catch (e) {} };
    var go = document.getElementById('tipsGo');
    if (go) go.onclick = function () { installEvent.prompt(); installEvent.userChoice.then(function () { t.remove(); }); };
  }
  function showInstallTip() {
    var closed = null;
    try { closed = localStorage.getItem('kokboken-tips'); } catch (e) {}
    if (standalone() || closed || !/Mobi|Android|iPhone|iPad/.test(navigator.userAgent + (isIOS() ? ' iPhone' : ''))) return;
    var t = document.createElement('div');
    t.className = 'tips'; t.id = 'tips'; t.setAttribute('role', 'status');
    document.body.appendChild(t);
    renderTip(t);
  }
  window.addEventListener('appinstalled', function () { var t = document.getElementById('tips'); if (t) t.remove(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  var APPS = {
    skarp: 'https://script.google.com/macros/s/AKfycbxS5yofpzcw7tum_f3_0I-agP7ihwDkXchDMKBx2XolBaIsIFumfKfmXZO0UQvEnqYz/exec',
    test: 'https://script.google.com/macros/s/AKfycbwaCckzq2T4fowOAwCo_EbM-dzVGhlcOoAx51GtiJYdIGKQQ-sMHBZU1Apn_YiITPx6nQ/exec'
  };
  var p = new URLSearchParams(location.search);
  var key = p.get('k'), app = p.get('app');
  /* Nyckeln står kvar i adressen, så att den följer med när man lägger sidan på hemskärmen.
     Den sparas också i telefonen, ifall sidan öppnas utan nyckel. */
  /* En länk med nyckel bestämmer alltid själv vilken app som öppnas (utan ?app= blir det den skarpa).
     Bara en adress helt utan nyckel använder det som sparats sedan förra gången. */
  try {
    if (key) {
      localStorage.setItem('kokboken-k', key);
      if (app) localStorage.setItem('kokboken-app', app); else localStorage.removeItem('kokboken-app');
    } else {
      key = localStorage.getItem('kokboken-k');
      app = localStorage.getItem('kokboken-app');
    }
  } catch (e) {}
  var base = APPS[app] || APPS.skarp;
  if (key) {
    var f = document.createElement('iframe');
    f.title = 'Kokboken';
    f.allow = 'clipboard-read; clipboard-write; web-share; fullscreen; screen-wake-lock';
    f.src = base + '?k=' + encodeURIComponent(key);
    document.body.appendChild(f);
    showInstallTip();
  } else {
    document.body.innerHTML = '<div class="msg"><img src="ikon-192.png" alt=""><h1>Kokboken</h1><p>Be Victor eller Lovisa om din länk.</p></div>';
  }
</script>
</body>
</html>
