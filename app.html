<!doctype html>
<!-- Byggd ur Index.html av verktyg/bygg-ny.mjs. Ändra inte här. -->
<html lang="sv">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Kokboken</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="ikon-192.png">
<link rel="apple-touch-icon" href="ikon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kokboken">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://lh3.googleusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* Färgskala Terrakotta. enamel = tegelröd huvudfärg, dill = oliv, lingon = djupröd för varningar och favoriter. t0-t5 = platshållare. */
:root{--paper:#FAF6EF;--surface:#FFFDF9;--ink:#3A2A20;--muted:#7A6553;--line:#E7DCCB;--enamel:#B5482F;--enamel-soft:#F4E2D6;--on-enamel:#FFFFFF;--lingon:#9E2B25;--dill:#5F6E2C;--dill-soft:#E8EBD6;
  --shadow:0 1px 2px rgba(58,42,32,.06),0 6px 18px rgba(58,42,32,.07);
  --t0b:#F4E2D6;--t0f:#9A3F27;--t1b:#E8EBD6;--t1f:#4F5E25;--t2b:#F6E7BD;--t2f:#7A5A0E;--t3b:#F3DEDF;--t3f:#8A3045;--t4b:#DCEAE3;--t4f:#245447;--t5b:#EDE3D6;--t5f:#6B4A2E;
  --serif:"Young Serif",Georgia,"Times New Roman",serif;--sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--nav-h:64px;color-scheme:light}
/* Mörkt läge är standard. Ljust läge väljs med knappen på Hem och sparas i telefonen (data-theme på html). */
:root[data-theme="dark"]{--paper:#1C1612;--surface:#271F19;--ink:#F2E9DF;--muted:#B5A391;--line:#3B3028;--enamel:#E2876A;--enamel-soft:#3D271E;--on-enamel:#1C1612;--lingon:#F08A7E;--dill:#B6C47C;--dill-soft:#2B301C;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.25);
  --t0b:#3D271E;--t0f:#F0A88E;--t1b:#2B301C;--t1f:#C9D58F;--t2b:#3A3015;--t2f:#EBC979;--t3b:#3A2226;--t3f:#EFA2B0;--t4b:#1D332C;--t4f:#93CDB8;--t5b:#33291F;--t5f:#D9BC9A;color-scheme:dark}
.t0{background:var(--t0b)!important;color:var(--t0f)!important}.t1{background:var(--t1b)!important;color:var(--t1f)!important}.t2{background:var(--t2b)!important;color:var(--t2f)!important}
.t3{background:var(--t3b)!important;color:var(--t3f)!important}.t4{background:var(--t4b)!important;color:var(--t4f)!important}.t5{background:var(--t5b)!important;color:var(--t5f)!important}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
img{max-width:100%;height:auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--enamel);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.sync{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));right:12px;z-index:30;color:var(--muted);font-size:.78rem;pointer-events:none}
.sync:empty{display:none}
.phead{margin-bottom:4px}
.iconbtn.primary{background:var(--enamel);border-color:var(--enamel);color:var(--on-enamel)}
/* Hem */
.hhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.hello{margin:0;color:var(--muted);font-size:.92rem}
.htitle{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,8vw,3rem);line-height:1.05;margin:2px 0 0}
.avatar{width:42px;height:42px;border-radius:99px;border:0;background:var(--enamel-soft);color:var(--enamel);font-weight:700;font-size:1.05rem;cursor:pointer;flex:none}
.homemain{max-width:640px}
.hsearch input{margin:0}
.sugcard{margin-top:12px;border:1px solid var(--line);background:var(--surface);border-radius:14px;overflow:hidden}
.sugmain{display:block;background:none;border:0;padding:0;text-align:left;cursor:pointer;width:100%;color:inherit}
.sugmain img,.sugmain .ph{width:100%;aspect-ratio:16/9;max-height:260px;object-fit:cover;display:flex;align-items:center;justify-content:center;background:var(--enamel-soft);font-family:var(--serif);font-size:3rem;color:var(--enamel)}
.sugtxt{display:flex;flex-direction:column;min-width:0;padding:12px 14px 0}
.sugbody{padding:8px 14px 14px}
.sugbody .k{padding:4px 0 0}
.sugcard .k{font-size:.8rem;color:var(--muted);font-weight:600;margin:0}
.sugtxt .t{font-family:var(--serif);font-size:1.45rem;line-height:1.15;margin:2px 0 4px;overflow-wrap:anywhere;hyphens:auto}
.sugbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.selchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.selchip{border:0;background:var(--dill);color:var(--surface);border-radius:99px;padding:5px 11px;font-size:.82rem;font-weight:600;cursor:pointer;min-height:32px}
.rcard .t,.ftile span,.entry .t{overflow-wrap:anywhere;hyphens:auto}
.sugtxt .m{font-size:.82rem;color:var(--dill)}
.hsec{font-size:.95rem;margin:18px 0 8px}
/* Kategorirubrikerna i Recept (Kategorier) fälls ihop med ett tryck. */
.hsec.cath{margin:12px 0 4px}
.cathead{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:4px 0;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.cathead .arrow{width:1em;color:var(--muted);flex:none}
/* Nyligen i Recept: en rad som skrollar i sidled. */
.recent{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.recent .rcard{flex:0 0 112px;width:112px}
.recent .rcard .t{font-size:.88rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.recent .rcard .ph{font-size:1.6rem}
.frow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:var(--enamel);color:var(--on-enamel);font-size:.78rem;font-weight:700;margin-left:4px;vertical-align:middle}
.rgrid.mini{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px 10px;margin-top:10px}
.rgrid.mini .t{font-size:.92rem}
/* Recept: rutnät, Att testa */
.tabhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.tabhead button{background:none;border:0;padding:4px 0;font:inherit;color:var(--muted);cursor:pointer;font-size:1.15rem;min-height:40px}
.tabhead button[aria-pressed="true"]{color:var(--ink);font-size:1.7rem;border-bottom:2px solid var(--enamel)}
.tabhead .count{font-family:var(--sans)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 12px;margin-top:4px}
.rcard{position:relative;display:flex;flex-direction:column;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.rcard img,.rcard .ph{width:100%;aspect-ratio:4/3;border-radius:10px;object-fit:cover;background:var(--enamel-soft);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:2.2rem;color:var(--enamel)}
.rcard.idea-card .ph{background:var(--dill-soft);color:var(--dill)}
.rcard .t{font-family:var(--serif);font-size:1.02rem;line-height:1.22;margin-top:6px}
.rcard .m{font-size:.8rem;color:var(--muted);margin-top:2px}
.rcard .ttbadge{position:absolute;top:8px;left:8px}
.rstar{position:absolute;top:6px;right:6px;height:24px;padding:0 7px;border-radius:99px;background:rgba(40,24,14,.55);color:#fff;font-size:.78rem;letter-spacing:1px;display:flex;align-items:center;justify-content:center}
.ttbadge{display:inline-block;font-family:var(--sans);font-size:.7rem;font-weight:700;background:var(--dill-soft);color:var(--dill);padding:2px 8px;border-radius:99px;vertical-align:middle}
.ttcheck{display:flex;gap:12px;align-items:flex-start;margin:12px 0 4px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--dill-soft);cursor:pointer}
.ttcheck input{width:22px;height:22px;margin-top:1px;accent-color:var(--dill);flex:none}
.ttcheck span{display:flex;flex-direction:column;gap:2px}
.shelfrow{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 12px}
.btile{flex:0 0 96px;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink);font-size:.82rem;line-height:1.25;display:flex;flex-direction:column;gap:2px}
.btile img,.btile .ph{width:96px;height:128px;border-radius:8px;object-fit:cover;display:flex;align-items:center;justify-content:center;background:var(--enamel-soft);color:var(--enamel);font-family:var(--serif);font-size:1.6rem;margin-bottom:4px;box-shadow:var(--shadow)}
.btile[aria-pressed="true"] img,.btile[aria-pressed="true"] .ph{outline:3px solid var(--enamel);outline-offset:2px}
.btile .t{font-weight:600}.btile .m{color:var(--muted);font-size:.78rem}
.covermini{width:48px;height:64px;border-radius:6px;object-fit:cover;flex:none}
.shelflist{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--line)}
.shelflist label{display:grid;grid-template-columns:24px 1fr;column-gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer;align-items:start}
.shelflist input{width:22px;height:22px;margin:0;accent-color:var(--dill)}
.shelflist small{grid-column:2;color:var(--muted);font-size:.85rem}
.ttcheck small{color:var(--muted);font-size:.85rem;line-height:1.4}
.menulist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.menulist button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:52px}
.menulist small{color:var(--muted);font-size:.85rem}
main{padding:20px 0 calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}

/* Navigering: nederst på mobil, överst på större skärmar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:8px 2px 7px;cursor:pointer;color:var(--muted);font-size:.72rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:var(--nav-h)}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--enamel)}
nav.tabs .ic{position:relative;display:inline-flex}
nav.tabs .badge{position:absolute;top:-5px;right:-11px;background:var(--lingon);color:#fff;border-radius:99px;font-size:.66rem;min-width:18px;height:18px;padding:0 5px;display:flex;align-items:center;justify-content:center;line-height:1}
@media (min-width:760px){nav.tabs .badge{position:static;margin-left:6px}}
@media (min-width:760px){
  nav.tabs{position:static;display:flex;gap:4px;margin:18px 0 0;border:0;border-bottom:1px solid var(--line);background:none;padding:0}
  nav.tabs button{flex-direction:row;font-size:.95rem;padding:10px 14px;min-height:0;border-bottom:3px solid transparent;margin-bottom:-1px}
  nav.tabs svg{width:18px;height:18px}
  nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--enamel)}
  main{padding-bottom:80px}
}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:.95rem;min-height:44px}
.btn.primary{background:var(--enamel);border-color:var(--enamel);color:var(--on-enamel)}
.btn.danger{color:var(--lingon)}
.btn.small{min-height:36px;padding:6px 11px;font-size:.88rem}
.btn[disabled]{opacity:.55;cursor:default}
.link{background:none;border:0;padding:4px 0;color:var(--enamel);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
input[type=search],input[type=text],input[type=number],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:110px;resize:vertical;line-height:1.45}
label.f{display:block;font-weight:600;font-size:.9rem;margin:14px 0 5px}
label.f small{font-weight:400;color:var(--muted)}
h2.sec{font-family:var(--serif);font-weight:400;font-size:1.7rem;margin:0;line-height:1.15}
.lede{color:var(--muted);margin:.35rem 0 0;max-width:62ch}
.empty{border:1px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted);margin-top:18px}
.firstbox strong{display:block;font-family:var(--serif);font-weight:400;font-size:1.3rem;color:var(--ink);margin-bottom:6px}
.firstbox .row{gap:8px;margin:14px 0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.muted{color:var(--muted)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

/* Veckan */
.weeknav{display:flex;align-items:center;gap:8px;margin-top:4px}
.weeknav .lede{margin:0}
.iconbtn{width:40px;height:40px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.1rem;display:inline-flex;align-items:center;justify-content:center;flex:none}
.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:16px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;min-height:170px;gap:4px}
.day header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.dname{font-weight:600;font-size:.9rem;color:var(--muted)}
.dnum{font-family:var(--serif);font-size:2rem;line-height:1}
.day.is-today{border:2px solid var(--enamel)}
.day.is-today .dname{color:var(--enamel)}
.dish{background:none;border:0;padding:0;text-align:left;font-family:var(--serif);font-size:1.1rem;line-height:1.25;color:var(--ink)}
button.dish{cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.why{font-size:.83rem;color:var(--muted);margin:2px 0 0}
.dthumb{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block;margin-bottom:6px;background:var(--enamel-soft)}
.dayedit{margin-top:auto;align-self:flex-start;justify-self:start;font-size:.85rem}
.plan-free{background:none;border:1px dashed var(--line);border-radius:8px;padding:10px;color:var(--muted);cursor:pointer;text-align:left;margin-top:auto;min-height:44px}
@media (max-width:1000px){.weekgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){
  .weekgrid{grid-template-columns:1fr;gap:8px}
  .day{min-height:0;display:grid;grid-template-columns:52px 1fr;column-gap:12px;align-items:start;padding:12px}
  .day header{flex-direction:column;align-items:flex-start;grid-row:span 5;margin:0}
  .day .dthumb{display:none}
  .plan-free{margin-top:0;padding:8px 10px}
}
.weekactions{margin-top:18px}

/* Recept */
.toolbar{margin:14px 0 12px;display:grid;grid-template-columns:1fr auto;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:.87rem;cursor:pointer;white-space:nowrap;min-height:36px}
.chip[aria-pressed="true"],.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
/* Rullgardin som ser ut som en chip. */
select.chip,select.chip.on{-webkit-appearance:none;appearance:none;width:auto;max-width:none;font:inherit;font-size:.87rem;padding:6px 28px 6px 13px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:right 14px center,right 9px center;background-size:5px 5px;background-repeat:no-repeat;flex:none}
.index{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.index li{border-bottom:1px solid var(--line)}
.entry{display:grid;grid-template-columns:56px 1fr auto;gap:2px 14px;width:100%;text-align:left;background:none;border:0;padding:12px 2px;cursor:pointer;align-items:center}
.entry .thumb{grid-row:1/span 2;width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--enamel-soft);display:flex;align-items:center;justify-content:center;font-family:var(--serif);color:var(--enamel);font-size:1.4rem}
.entry .t{font-family:var(--serif);font-size:1.15rem;line-height:1.25}
.entry .m{color:var(--muted);font-size:.85rem;grid-column:2}
.entry .star{grid-row:1/span 2;grid-column:3;color:var(--lingon);font-size:.9rem;letter-spacing:1px;white-space:nowrap}

/* Dialog */
dialog{border:0;border-radius:18px;padding:0;width:min(680px,calc(100% - 24px));max-height:calc(var(--app-h,100vh) * .9);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(40,24,14,.35)}
dialog::backdrop{background:rgba(40,26,18,.45)}
.dlg{padding:20px 20px 24px;overflow:auto;max-height:calc(var(--app-h,100vh) * .9)}
.dlg h2{font-family:var(--serif);font-weight:400;font-size:1.8rem;line-height:1.15;margin:0 44px 6px 0}
.x{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.1rem;z-index:2}
@media (max-width:620px){
  dialog{width:100%;max-width:100%;height:100%;max-height:100%;margin:0;border-radius:0}
  .dlg{max-height:100%;height:100%;padding:16px 16px calc(28px + env(safe-area-inset-bottom,0px))}
  .x{top:calc(10px + env(safe-area-inset-top,0px))}
  .dlg{padding-top:calc(16px + env(safe-area-inset-top,0px))}
}
.hero-photo{width:calc(100% + 40px);margin:-20px -20px 16px;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--enamel-soft)}
@media (max-width:620px){.hero-photo{width:calc(100% + 32px);margin:calc(-16px - env(safe-area-inset-top,0px)) -16px 16px}}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.thumbs button{padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer;background:none;line-height:0}
.thumbs button[aria-pressed="true"]{border-color:var(--enamel)}
.thumbs img{width:60px;height:60px;object-fit:cover}
.herowrap{position:relative;display:flow-root}
.addphoto{position:absolute;right:12px;bottom:28px;min-height:40px;padding:6px 14px;border:0;border-radius:999px;background:rgba(28,22,18,.72);color:#fff;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer}
.addphoto.empty{position:static;display:inline-flex;align-items:center;margin:0 0 10px;background:none;color:var(--muted);border:1.5px dashed var(--line);border-radius:10px;font-weight:500}
.photobtn{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;line-height:0}
#viewer{width:100%;height:100vh;height:var(--app-h,100dvh);max-width:none;max-height:none;border-radius:0;background:#000;color:#fff;box-shadow:none;overflow:hidden}
#viewer::backdrop{background:#000}
#viewer .vwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#viewer img{max-width:100%;max-height:100%;user-select:none;-webkit-user-drag:none;will-change:transform}
#viewer .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;background:rgba(0,0,0,.55);color:#fff;border-color:rgba(255,255,255,.35);width:44px;height:44px;z-index:3}
#viewer .vnav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;background:rgba(0,0,0,.45);color:#fff;border:0;width:48px;height:64px;font-size:2rem;border-radius:10px;cursor:pointer}
#viewer .prev{left:8px}
#viewer .next{right:8px}
#viewer .vcount{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.9rem;opacity:.85;z-index:2;pointer-events:none}

(function () {

/* Obs: Google tar bort allt efter två snedstreck i skripten, därför skrivs adressen så här. */

const FR = {'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3};

/* Appens höjd i pixlar (--app-h). Används i stället för vh och dvh: när appen ligger i startsidans ram på hemskärmen (iPhone)

/* ================= Data och server ================= */

const T = { script: performance.now() };

/* Valen (menyn, sortering, Förslag, tema, vy) sparas i telefonen och, för säkerhets skull, hos servern per person (savePrefs).

const PREF_KEYS = ['kokboken-flikar', 'kokboken-recept', 'kokboken-forslag', 'kokboken-tema', 'kokboken-vy'];
function prefGet(k){ let v = null; try { v = localStorage.getItem(k); } catch (e) {} return v != null ? v : (D && D.prefs && typeof D.prefs[k] === 'string' ? D.prefs[k] : null); }

const PASTE_FOR = ['Victor'];

function call(action, p){

      .withSuccessHandler(data => { pending--; lastLoad = Date.now(); if (action !== 'load') { T.save = performance.now() - t0; T.saveAction = action; drawTiming(); }

/* ================= Säsong ================= */
const STOP = new Set(['och','i','från','slutet','början']);
function norm(s){ return String(s).toLowerCase().replace(/[åä]/g,'a').replace(/ö/g,'o').replace(/é/g,'e'); }

function seasonKey(item){

const NOT_SEASON = new Set(['majsstarkelse', 'maizena', 'pumpakarnor', 'pumpafron', 'sotpotatis', 'sotpotatisen', 'citrongras', 'citrongraset', 'svartpeppar']);
/* Ett ord i receptet träffar råvaran om det börjar med roten (rödbeta: rodbet), bara skiljer sig i sista bokstaven (morot: morott)

function seasonHit(w, k){
  const { root } = k;
  if (root.length < 3 || NOT_SEASON.has(w)) return false;
  if (w.startsWith(root)) return true;
  if (root.length >= 5 && w.length >= root.length - 1 && root.startsWith(w)) return true;
  return root.length >= 5 && w.indexOf(root) > 0;
}
const recipeWords = r => norm(r.ingredients.join(' ') + ' ' + r.title).split(/[^a-z0-9]+/).filter(Boolean);
function seasonStems(month){ if (stemMemo.has(month) && seasonMemoD === D) return stemMemo.get(month); const out = []; seasonFor(month).forEach(s => s.items.forEach(it => { const st = stemOf(it), key = seasonKey(it); if (st.length >= 3) out.push({ st, key, label: it.split('(')[0].trim() }); })); if (seasonMemoD === D) stemMemo.set(month, out); return out; }

let seasonMemo = new Map(), seasonMemoD = null, stemMemo = new Map();

const escRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

/* Rubriker i ingredienserna: en rad som slutar med kolon och inte börjar med en mängd, t.ex. "Sås:". */
const isHead = s => /:\s*$/.test(s) && !/^\s*[\d½¼¾⅓⅔]/.test(s) && s.length <= 50;
const headName = s => s.replace(/:\s*$/, '').trim();
/* Ingredienserna att handla och räkna portioner på: allt utom rubriker och det borttagna. */
const versionIng = (r, sel) => withVersion(r, sel).ing.filter(x => x.kind !== 'del' && !isHead(x.text)).map(x => x.text);
/* Ingredienser per steg (matlagningsläget): huvudordet i varje ingrediens söks i stegets text.
 * "1 gul lök" ger "lok", som hittar "löken". Nämner steget en rubrik ("såsen") visas hela den delen. */
const UNITS = new Set(['g', 'kg', 'hg', 'mg', 'l', 'dl', 'cl', 'ml', 'msk', 'tsk', 'krm', 'st', 'burk', 'burkar', 'paket', 'förp', 'nypa', 'knippe', 'kvist', 'kvistar', 'skiva', 'skivor', 'bit', 'bitar', 'näve', 'cm', 'liten', 'litet', 'stor', 'stort', 'stora', 'små']);

function ingWord(line){

/* Ordet utan bestämd form: löken -> lok, oljan -> olja, morötterna -> morott. */
const wordRoot = w => w.replace(/(arna|erna|orna|na|en|et|n)$/, '');
/* Ett ord i steget hör till ingrediensen om orden börjar likadant tillräckligt långt (kokosgrädden hittar kokosgrädde men inte kokosmjölk),

/* Svarar med en lista per steg: ingrediensraderna (som { text, kind }) som steget nämner. */
function stepIngredients(V){

    sections.forEach(sec => {

  seasonFor(thisMonth()).forEach(s => s.items.forEach(it => { const label = it.split('(')[0].trim(); const k = label.toLowerCase(); if (label && !seen.has(k)) { seen.add(k); out.push(label); } }));

}
function recipeHas(r, label){
  const key = seasonKey(label);

/* Kandidater till kvällens förslag utifrån valda säsongsråvaror och det man har hemma. */
function homeCandidates(){
  const H = S.home, sel = [...H.sel], have = norm(H.have.trim()).split(/[,\s]+/).filter(w => w.length > 2);
  /* Reserv: har kokboken inga huvudrätter alls (inga kategoritaggar) föreslås recepten i Övrigt, så att Hem aldrig blir tomt. */
  const pool = sugPool(), meals = pool.some(r => isMeal(r) && !isShelf(r) && !isTT(r));
  return pool.map(r => {
    if (!isMeal(r) && (meals || categoryOf(r) !== 'Övrigt')) return null;
    if (isShelf(r) && !H.shelf) return null;
    if (isTT(r) && !H.tt) return null;
    if (H.quick && (!r.time || r.time > QUICK_MIN)) return null;
    if (sel.length && !sel.every(l => recipeHas(r, l))) return null;
    if (have.length) { const txt = norm(r.ingredients.join(' ') + ' ' + r.title); if (!have.every(h => txt.includes(h.length > 5 ? h.slice(0, 5) : h))) return null; }
    const sm = sugPrefs().season ? seasonMatches(r, thisMonth()) : [], ds = daysSince(r.lastCooked);
    /* En favorit ger en poäng extra: den kommer upp ungefär dubbelt så ofta som andra recept, men tar inte över. */
    let score = 1 + sm.length + (isFav(r) ? 1 : 0) + (ds >= 30 ? 1 : 0);
    if (ds < 7) score *= 0.3;
    return { r, sm, score };
  }).filter(Boolean);
}
function pickSuggestion(fresh){
  const H = S.home, pool = homeCandidates();
  if (!pool.length) { H.sug = ''; return; }
  if (!fresh && pool.some(x => x.r.id === H.sug)) return;
  let rest = pool.filter(x => !H.seen.includes(x.r.id));
  if (!rest.length) { H.seen = []; rest = pool; }
  const total = rest.reduce((s, x) => s + x.score, 0); let p = Math.random() * total, i = 0;
  while (p > rest[i].score && i < rest.length - 1) { p -= rest[i].score; i++; }
  H.sug = rest[i].r.id; H.seen.push(H.sug);
}

 * favoriterna och kockens startfrågor, så att inget är tomt i början. Läsare ser bara sin egen kokbok. */
const SMALL_BOOK = 15;
const hasStd = () => !!stdBook() && D.books.some(b => b.id === stdBook());
/* Hemskärmen: klar om appen körs som hemskärmsapp (om ramen kan se det) eller om man har tryckt Klart i instruktionen. */
function homeSaved(){
  try { if (window.matchMedia('(display-mode: standalone)').matches || localStorage.getItem('kokboken-hemskarm')) return true; } catch (e) {}
  return false;
}
function openHomeScreen(){

/* Första receptet: samma val som Lägg till, och överst att välja ett ur standardkokboken. */
function openFirstRecipe(){
  openAddMenu();

  const list = $('#dlgBody .menulist');
  if (list) list.insertAdjacentHTML('afterbegin', `<button data-act="startStd"><strong>Välj ur ${esc(bookLabel(stdBook()))}</strong><small>Öppna ett recept och tryck på Spara i min kokbok</small></button>`);

const useStd = () => !isReader() && !!stdBook() && me().book !== stdBook() && D.books.some(b => b.id === stdBook()) && mine().filter(r => !isShelf(r) && !isTT(r)).length < SMALL_BOOK;
const homeRecipes = () => useStd() ? mine().concat(D.recipes.filter(r => r.book === stdBook())) : mine();
/* Förslagen kommer från den egna kokboken och de andra kokböcker man har valt (där syns bara recepten). */
function sugPool(){
  const extra = new Set(isReader() ? [] : sugPrefs().books.filter(id => id !== me().book && D.books.some(b => b.id === id)));
  if (useStd()) extra.add(stdBook());
  return D.recipes.filter(r => r.book === me().book || extra.has(r.book));
}
function openSugPrefs(){
  S.detail = null;

/* Knapparna på förslagskortet: Nytt förslag, Snabba rätter, Har hemma, Att testa och I bokhyllan (de två sista bara om det finns sådana recept)
 * och Anpassa (vilka andra kokböcker förslagen får komma från; inte för läsare). */
function sugButtons(withNew){
  const H = S.home, nHave = H.have.split(/[,\s]+/).filter(w => w.length > 2).length, own = !isReader();
  const tog = (act, on, text) => `<button class="btn small" data-act="${act}" aria-pressed="${!!on}">${on ? '✓ ' : ''}${text}</button>`;
  const others = own && D.books.some(b => b.id !== me().book);
  return `<div class="sugbtns">${withNew ? '<button class="btn small" data-act="newSug">Nytt förslag</button>' : ''}${tog('quick', H.quick, 'Snabba rätter')}<button class="btn small" data-act="haveToggle" aria-expanded="${!!H.showHave}" aria-pressed="${!!H.have.trim()}">${H.have.trim() ? '✓ ' : ''}Har hemma${nHave ? ` (${nHave})` : ''}</button>${own && mine().some(isTT) ? tog('sugTT', H.tt, 'Att testa') : ''}${own && mine().some(isShelf) ? tog('sugShelf', H.shelf, 'I bokhyllan') : ''}${others ? '<button class="btn small" data-act="sugPrefs">Anpassa</button>' : ''}</div>
    <div id="havebox" class="havebox" ${H.showHave ? '' : 'hidden'}>
      <label for="homeHave" class="sr">Har hemma</label>
      <div class="row" style="flex-wrap:nowrap"><input type="search" id="homeHave" placeholder="Skriv vad ni har, t.ex. kikärtor, spenat" value="${esc(H.have)}" autocomplete="off" enterkeyhint="search"><button class="btn small primary" data-act="haveApply">Visa</button></div>
      ${H.have.trim() ? '<button class="link" data-act="haveClear" style="font-size:.88rem;margin-top:6px">Rensa</button>' : ''}
    </div>`;
}
function suggestionCard(){
  pickSuggestion(false);
  const H = S.home, r = byId(H.sug);
  const maxTxt = H.quick ? ` på högst ${QUICK_MIN} min` : '';
  const label = (H.have.trim() ? 'Förslag med det ni har hemma' : H.quick ? 'Snabbt förslag' : 'Förslag till i kväll') + maxTxt;
  if (!r) return `<div class="sugcard"><div class="sugbody"><p class="k">${esc(label)}</p><p class="muted" style="margin:4px 0 0;font-size:.92rem">${sugPool().length ? 'Inget av era recept passar. Välj något annat eller ändra det ni har hemma.' : 'När det finns recept föreslår kokboken något här.'}</p>${sugButtons(true)}</div></div>`;
  /* Med Har hemma eller Snabba rätter och flera träffar: visa alla som rutnät, bäst först. */
  const pool = homeCandidates();
  if ((H.have.trim() || H.quick) && pool.length > 1) {
    const hits = pool.sort((a, b) => b.score - a.score).map(x => x.r);
    const label2 = (H.have.trim() ? 'Med det ni har hemma' : 'Rätter') + maxTxt;
    return `<div class="sugcard"><div class="sugbody">
      <p class="k">${esc(label2)} <span class="count" aria-label="${hits.length} recept passar">${hits.length}</span></p>
      <div class="rgrid mini">${hits.map(x => `<button class="rcard" data-act="open" data-id="${esc(x.id)}">${pic(x) ? `<img src="${photoUrl(pic(x), 400)}" alt="" loading="lazy">` : `<span class="ph ${tint(x.title)}" aria-hidden="true">${esc(x.title.slice(0, 1))}</span>`}${isTT(x) ? '<span class="ttbadge">Att testa</span>' : isShelf(x) ? '<span class="ttbadge">I bokhyllan</span>' : ''}${favMark(x, 'rstar')}<span class="t">${esc(x.title)}</span><span class="m">${esc(isShelf(x) ? shelfWhere(x) : x.time ? x.time + ' min' : '')}</span></button>`).join('')}</div>
      ${sugButtons(false)}
    </div></div>`;
  }
  const from = r.book !== me().book ? `ur ${gen(bookName(r.book))} kokbok` : '';
  /* Omslaget: bilden i full bredd med rätten ovanpå, Nytt förslag (↻) i hörnet och valen som piller under. */
  return `<div class="sugcard sugcover">
    <div class="sugpic"><button class="sugmain" data-act="open" data-id="${esc(r.id)}">${pic(r) ? `<img src="${photoUrl(pic(r), 700)}" alt="" loading="lazy">` : `<span class="ph ${tint(r.title)}" aria-hidden="true">${esc(r.title.slice(0, 1))}</span>`}
      <span class="sugtxt"><span class="k">${esc(label)}${isTT(r) ? ' <span class="ttbadge">Att testa</span>' : isShelf(r) ? ' <span class="ttbadge">I bokhyllan</span>' : ''}</span><span class="t">${esc(r.title)}</span><span class="m">${esc([isShelf(r) && shelfWhere(r), from, r.time && r.time + ' min', isFav(r) ? HEART + ' favorit' : ''].filter(Boolean).join(' · '))}</span></span></button>
    <button class="sugnew" data-act="newSug" aria-label="Nytt förslag"><span aria-hidden="true">↻</span></button></div>
    ${sugButtons(false)}

}

  /* Gjorda steg döljs (Hem ska få plats utan att skrolla); rubriken visar hur många som är klara. */

        <button class="themebtn" data-act="theme" aria-label="${dark ? 'Byt till ljust läge' : 'Byt till mörkt läge'}">${dark ? '☀' : '☾'}</button>

        <div id="sugbox">${suggestionCard()}</div>

/* ================= Veckan ================= */
function weekMonday(){ return addDays(mondayOf(new Date()), S.weekOff * 7); }
function viewWeek(){
  const mon = weekMonday(), end = addDays(mon, 6), today = iso(new Date());
  const range = mon.getMonth() === end.getMonth() ? `${mon.getDate()}–${end.getDate()} ${MONTHS[end.getMonth()]}` : `${mon.getDate()} ${MONTHS[mon.getMonth()]} – ${end.getDate()} ${MONTHS[end.getMonth()]}`;
  const label = S.weekOff === 0 ? 'Den här veckan' : S.weekOff === 1 ? 'Nästa vecka' : S.weekOff === -1 ? 'Förra veckan' : `Vecka ${isoWeek(mon)}`;
  let planned = 0;
  const tiles = DAYS.map((name, i) => {
    const date = iso(addDays(mon, i)); const d = D.plan.find(p => p.date === date);
    const r = d && d.recipeId && byId(d.recipeId);
    if (d) planned++;
    const ph = r && pic(r);
    const body = !d ? `<button class="plan-free" data-act="planDay" data-date="${date}">+ Planera</button>` : `
      ${ph ? `<img class="dthumb" src="${photoUrl(ph, 500)}" alt="" loading="lazy">` : ''}
      ${r ? `<button class="dish" data-act="open" data-id="${esc(r.id)}">${esc(r.title)}</button>` : `<span class="dish">${esc(d.title)}</span>`}
      ${d.note ? `<p class="why">${esc(d.note)}</p>` : ''}
      <button class="link dayedit" data-act="planDay" data-date="${date}">Ändra</button>`;
    return `<article class="day ${date === today ? 'is-today' : ''}"><header><span class="dname">${name.slice(0, 3)}<span class="sr">${name.slice(3)}</span></span><span class="dnum">${addDays(mon, i).getDate()}</span></header>${body}</article>`;
  }).join('');
  return `<h2 class="sec">${label}</h2>
    <div class="weeknav"><button class="iconbtn" data-act="week" data-d="-1" aria-label="Föregående vecka">‹</button><p class="lede">Vecka ${isoWeek(mon)}, ${range}</p><button class="iconbtn" data-act="week" data-d="1" aria-label="Nästa vecka">›</button>${S.weekOff ? `<button class="link" data-act="week" data-d="0">I dag</button>` : ''}</div>
    <div class="weekgrid">${tiles}</div>
    ${planned ? `<div class="weekactions row"><button class="btn" data-act="weekShop">Lägg veckans ingredienser i inköpslistan</button></div>` : ''}`;
}

function pickList(q){
  q = q.trim().toLowerCase();
  const pool = homeRecipes().filter(r => !isShelf(r));
  const list = pool.filter(r => !q || norm(r.title + ' ' + r.tags.join(' ')).includes(norm(q)))
    .sort((a, b) => (a.book === me().book ? 0 : 1) - (b.book === me().book ? 0 : 1) || byFav(a, b));
  if (!pool.length) return `<p class="muted" style="padding:10px 0">Inga recept ännu.</p>`;
  if (!list.length) return `<p class="muted" style="padding:10px 0">Inget recept matchar.</p>`;
  return list.map(r => `<button data-act="planPick" data-id="${esc(r.id)}">${isFav(r) ? HEART + ' ' : ''}${esc(r.title)}<small>${[r.book !== me().book ? 'ur ' + bookLabel(r.book) : '', r.time ? r.time + ' min' : ''].filter(Boolean).join(' · ')}</small></button>`).join('');
}

/* ================= Recept ================= */
function curBook(){ return S.book && D.books.some(b => b.id === S.book) ? S.book : me().book; }
function bookRecipes(){ const b = curBook(); return D.recipes.filter(r => r.book === b); }
/* ================= Kategorier i Recept =================
 * Taggarna och ingredienserna sorteras i kategorier med ordlistor. Ordstammarna skrivs som norm() gör dem (å, ä -> a, ö -> o).
 * Ett recept kan hamna i flera val inom samma kategori. Inom en kategori räcker det att ett val stämmer, mellan kategorier måste alla stämma. */
const FACETS = [['land', 'Land'], ['maltid', 'Måltid'], ['typ', 'Typ av rätt'], ['ingr', 'Ingrediens'], ['arstid', 'Årstid'], ['ovrigt', 'Övrigt']];
const LAND_WORDS = [['ital', 'Italien'], ['frank', 'Frankrike'], ['fransk', 'Frankrike'], ['span', 'Spanien'], ['portug', 'Portugal'], ['grek', 'Grekland'], ['turk', 'Turkiet'], ['liban', 'Libanon'], ['syri', 'Syrien'], ['israel', 'Israel'], ['iran', 'Iran'], ['pers', 'Iran'], ['georg', 'Georgien'], ['marock', 'Marocko'], ['nordafrik', 'Nordafrika'], ['etiop', 'Etiopien'], ['mellanost', 'Mellanöstern'], ['indi', 'Indien'], ['pakist', 'Pakistan'], ['sri lank', 'Sri Lanka'], ['thai', 'Thailand'], ['vietnam', 'Vietnam'], ['kina', 'Kina'], ['kines', 'Kina'], ['japan', 'Japan'], ['korea', 'Korea'], ['indones', 'Indonesien'], ['malays', 'Malaysia'], ['mexik', 'Mexiko'], ['peru', 'Peru'], ['brasil', 'Brasilien'], ['karib', 'Karibien'], ['usa', 'USA'], ['amerik', 'USA'], ['brit', 'Storbritannien'], ['engelsk', 'Storbritannien'], ['tysk', 'Tyskland'], ['polen', 'Polen'], ['polsk', 'Polen'], ['ryss', 'Ryssland'], ['sveri', 'Sverige'], ['svensk', 'Sverige'], ['husmans', 'Sverige'], ['norden', 'Norden'], ['nordisk', 'Norden'], ['dansk', 'Danmark'], ['norsk', 'Norge'], ['asiat', 'Asien'], ['afghan', 'Afghanistan'], ['kurd', 'Kurdistan'], ['irak', 'Irak'], ['egypt', 'Egypten']];
const MEAL_WORDS = [['frukost', 'Frukost'], ['brunch', 'Brunch'], ['lunch', 'Lunch'], ['middag', 'Middag'], ['vardag', 'Vardag'], ['helg', 'Helg'], ['fest', 'Fest'], ['forratt', 'Förrätt'], ['efterratt', 'Efterrätt'], ['dessert', 'Efterrätt'], ['bak', 'Bakat'], ['mellanmal', 'Mellanmål'], ['tillbehor', 'Tillbehör'], ['plockmat', 'Plockmat'], ['snacks', 'Plockmat'], ['matlad', 'Matlåda'], ['fika', 'Fika']];
const TYPE_WORDS = [['sopp', 'Soppa'], ['gryt', 'Gryta'], ['curry', 'Curry'], ['pasta', 'Pasta'], ['sallad', 'Sallad'], ['pizza', 'Pizza'], ['paj', 'Paj'], ['wok', 'Wok'], ['gratang', 'Gratäng'], ['risotto', 'Risotto'], ['bowl', 'Bowl'], ['nudel', 'Nudlar'], ['nudlar', 'Nudlar'], ['ramen', 'Nudlar'], ['dal', 'Dal'], ['taco', 'Tacos'], ['burgare', 'Burgare'], ['brod', 'Bröd'], ['pannkak', 'Pannkakor'], ['ugnsratt', 'Ugnsrätt'], ['biffar', 'Biffar'], ['stuvning', 'Stuvning'], ['omelett', 'Omelett']];
const SEASON_WORDS = [['var', 'Vår'], ['sommar', 'Sommar'], ['host', 'Höst'], ['vinter', 'Vinter'], ['jul', 'Jul'], ['pask', 'Påsk'], ['midsommar', 'Sommar']];
const INGR_WORDS = [['tofu', 'Tofu'], ['tempeh', 'Tempeh'], ['halloum', 'Halloumi'], ['feta', 'Fetaost'], ['parmes', 'Parmesan'], ['pecorino', 'Parmesan'], ['mozzarell', 'Mozzarella'], ['burrata', 'Mozzarella'], ['agg', 'Ägg'], ['kikart', 'Kikärtor'], ['lins', 'Linser'], ['bonor', 'Bönor'], ['bondbon', 'Bönor'], ['svamp', 'Svamp'], ['kantarell', 'Svamp'], ['champinjon', 'Svamp'], ['karljohan', 'Svamp'], ['pumpa', 'Pumpa'], ['butternut', 'Pumpa'], ['potatis', 'Potatis'], ['sotpotatis', 'Sötpotatis'], ['spetskal', 'Kål'], ['vitkal', 'Kål'], ['gronkal', 'Kål'], ['rodkal', 'Kål'], ['svartkal', 'Kål'], ['savojkal', 'Kål'], ['blomkal', 'Blomkål'], ['broccol', 'Broccoli'], ['spenat', 'Spenat'], ['auberg', 'Aubergine'], ['zucchin', 'Zucchini'], ['tomat', 'Tomat'], ['purjo', 'Purjolök'], ['sparris', 'Sparris'], ['majs', 'Majs'], ['rodbet', 'Rödbetor'], ['morot', 'Morötter'], ['avokado', 'Avokado'], ['kokos', 'Kokos'], ['quinoa', 'Quinoa'], ['bulgur', 'Bulgur'], ['couscous', 'Couscous'], ['polenta', 'Polenta'], ['gnocchi', 'Gnocchi'], ['nudl', 'Nudlar'], ['rakor', 'Räkor'], ['lax', 'Lax'], ['torsk', 'Torsk'], ['fisk', 'Fisk']];
const facetCache = new Map();
function facetsOf(r){
  const key = r.id + '|' + r.tags.join(',') + '|' + r.ingredients.length + '|' + r.title;
  if (facetCache.has(key)) return facetCache.get(key);
  const f = { land: new Set(), maltid: new Set(), typ: new Set(), ingr: new Set(), arstid: new Set(), ovrigt: new Set() };
  const hit = (words, s, exactShort) => words.filter(([st]) => exactShort && st.length <= 3 ? s === st : s.startsWith(st)).map(([, n]) => n);
  plainTags(r).forEach(t => {
    const s = norm(t.trim());

/* Taggförslag under Taggar: vanliga taggar och de som används mest i kokböckerna man ser. Tryck för att lägga till eller ta bort. */
const TAG_SUGGEST = ['Huvudrätt', 'Middag', 'Lunch', 'Vardag', 'Helg', 'Frukost', 'Förrätt', 'Efterrätt', 'Tillbehör', 'Sås', 'Soppa', 'Pasta', 'Gryta', 'Curry', 'Sallad'];
function tagChips(value){
  const cur = new Set(value.split(',').map(s => s.trim().toLowerCase()).filter(Boolean)), seen = new Set(TAG_SUGGEST.map(t => t.toLowerCase())), count = {};
  D.recipes.forEach(r => plainTags(r).forEach(t => { const k = t.trim(); if (!seen.has(k.toLowerCase())) count[k] = (count[k] || 0) + 1; }));
  const used = Object.entries(count).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([t]) => t);
  return TAG_SUGGEST.concat(used).map(t => `<button type="button" class="chip" data-act="tagChip" data-t="${esc(t)}" aria-pressed="${cur.has(t.toLowerCase())}">${esc(t)}</button>`).join('');
}
function drawTagChips(){ const el = $('#eTagChips'), inp = $('#eTags'); if (el && inp) el.innerHTML = tagChips(inp.value); }
function lines(v){ return v.split('\n').map(s => s.replace(/^\s*(?:[-•*]|\d+[.)])\s+/, '').trim()).filter(Boolean); }

/* Recept från länk: servern läser sidan, formuläret fylls i och man granskar innan man sparar. */

}

/* Webbadresser i kockens svar (källor från sökningen) blir länkar som visar webbplatsens namn. */

/* Favoritkök ur Kockens stil: raden "Favoritkök: indiskt, thailändskt." från introduktionen, eller "Thaimat och indisk mat är favoriter." */

/* Startfrågor i Fråga kocken, utifrån kokboken och Kockens stil: säsongen just nu, favoritköket, favoriterna, Att testa, det man har hemma och veckan. Högst fem. */

    { label: 'Gör det enklare', q: 'Kan du göra receptet enklare, med färre moment?' },
    { label: 'Anpassa efter säsongen', q: 'Hur kan vi anpassa receptet efter det som är i säsong nu?' },

  if (!isReader() && !D.chefStyleSet && !D.chefStyle) out.push({ label: 'Lär kocken känna er först', act: 'intro' });

  if (items.length >= 2) { const a = pick(items), b = pick(items.filter(x => x !== a)); out.push({ label: `Något med ${low(a)} och ${low(b)}`, q: `Vad kan vi laga i veckan med ${low(a)} och ${low(b)}? De är i säsong nu.` }); }
  const top = homeRecipes().filter(r => isFav(r) && !isShelf(r));

  if (ideas.length) { const t = pick(ideas); out.push({ label: `Hjälp med ${t}`, q: `Vi vill testa ${t}. Hur gör man, och hur passar det vår kokbok?` }); }

  return out.slice(0, 5);

/* Rutan överst i formuläret: vad kockens ändringar gör med ingredienserna och stegen, och varningar för versioner som rör en ändrad ingrediens. */
function changeSummary(old, r){
  const diff = (a, b) => { const na = a.map(x => norm(x.trim())), nb = b.map(x => norm(x.trim())); return { del: a.filter((x, i) => !nb.includes(na[i])), add: b.filter((x, i) => !na.includes(nb[i])) }; };
  const di = diff(old.ingredients, r.ingredients), ds = diff(old.steps, r.steps);
  const list = (d, label) => d.del.length || d.add.length ? `<p style="margin:8px 0 2px;font-weight:600">${label}</p>${d.del.map(x => `<div class="v-old">${esc(x)}</div>`).join('')}${d.add.map(x => `<div class="v-new">${esc(x)}</div>`).join('')}` : '';
  const warn = [];
  if (hasVersions(old)) Object.entries(old.versions).forEach(([k, v]) => {
    const name = v.namn || (VERSION_ALL.find(x => x[0] === k) || [])[1] || k;
    (v.byt || []).map(b => b.fran).concat(v.ta_bort || []).forEach(t => {
      const re = new RegExp(escRe(t), 'i');
      if (di.del.some(x => re.test(x))) warn.push(`${name} byter ut eller tar bort "${t}", som ändras här. Se över versionen.`);
    });
  });
  const none = !di.del.length && !di.add.length && !ds.del.length && !ds.add.length;
  return `<div class="vnote" id="eUpd"><b>Kockens ändringar</b>${none ? '<p>Ingredienserna och stegen är oförändrade. Titta på namn, beskrivning och tips.</p>' : list(di, 'Ingredienser') + list(ds, 'Steg')}

}

function parseImport(t){
  t = t.trim().replace(/^```[a-z]*\s*/i, '').replace(/```\s*$/, '');
  if (!t) return null;
  const j = JSON.parse(t);
  if (Array.isArray(j)) return { recipes: j, totest: [] };
  if (j.recipes || j.totest) return { recipes: j.recipes || [], totest: j.totest || [] };
  if (j.title || j.titel) return { recipes: [j], totest: [] };
  throw new Error('okänt format');
}

/* Timer: tider i stegen ("Sjud i ca 20 minuter", "1–2 timmar") blir knappar. Vid ett intervall räknar timern på den kortare tiden. */
function stepTimes(text){
  const out = [], re = /(\d+(?:[,.]\d+)?)(?:\s*[–-]\s*(\d+(?:[,.]\d+)?))?\s*(timmar|timme|tim|minuter|minut|min)\b/gi;
  let m; while ((m = re.exec(text)) && out.length < 2) {
    const a = parseFloat(m[1].replace(',', '.')), h = /^tim/i.test(m[3]);
    if (a > 0) out.push({ secs: Math.round(a * (h ? 3600 : 60)), label: m[1] + (m[2] ? '–' + m[2] : '') + (h ? ' tim' : ' min') });
  }
  return out;
}
S.timers = []; let timerTick = null, audioCtx = null;
const fmtTime = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
function startTimer(secs, label){

  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume && audioCtx.resume(); } catch (e) {}

}

}

let allStems = null;
function hasWord(s, w){
  if (w.length > 4) return s.includes(w);
  const L = 'a-zåäöéü';
  return new RegExp(`${w}($|[^${L}])`).test(s);
}
function guessGroup(t){
  const s = t.toLowerCase();
  for (const [g, ws] of GROUP_WORDS) if (ws.some(w => hasWord(s, w))) return g;
  if (!allStems) allStems = [].concat(...Array.from({ length: 12 }, (_, i) => seasonStems(i + 1)));
  const n = norm(t);
  const words = n.split(/[^a-z0-9]+/).filter(Boolean);
  if (allStems.some(({ key }) => words.some(w => seasonHit(w, key)))) return 'Frukt och grönt';
  return 'Övrigt';
}

    im.onload = () => { const s = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', q)); };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Bilden kunde inte läsas.')); };
    im.src = url;
  });
}

/* ================= Bildvisare: stor bild, nyp eller dubbeltryck för att zooma ================= */
const viewer = $('#viewer'), vimg = $('#vimg'), vwrap = $('#vwrap');
const V = { photos: [], i: 0, s: 1, x: 0, y: 0, pts: new Map(), start: null, lastTap: 0, swipeX: null };
function openViewer(photos, i){
  V.photos = photos; V.i = i;
  if (!viewer.open) viewer.showModal();
  drawViewer();
}
function drawViewer(){
  const many = V.photos.length > 1;
  V.s = 1; V.x = 0; V.y = 0; applyZoom();
  vimg.src = photoUrl(V.photos[V.i], 2000);
  viewer.querySelectorAll('.vnav').forEach(b => { b.style.display = many ? '' : 'none'; });
  $('#vcount').textContent = many ? `${V.i + 1} av ${V.photos.length}` : '';
}
function applyZoom(){
  if (V.s <= 1) { V.s = 1; V.x = 0; V.y = 0; }
  const mx = (V.s - 1) * vwrap.clientWidth / 2, my = (V.s - 1) * vwrap.clientHeight / 2;
  V.x = Math.max(-mx, Math.min(mx, V.x)); V.y = Math.max(-my, Math.min(my, V.y));
  vimg.style.transform = `translate(${V.x}px, ${V.y}px) scale(${V.s})`;
}
function stepViewer(d){ if (V.photos.length < 2) return; V.i = (V.i + d + V.photos.length) % V.photos.length; drawViewer(); }
const dist = () => { const [a, b] = [...V.pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
vwrap.addEventListener('pointerdown', e => {
  vwrap.setPointerCapture(e.pointerId);
  V.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (V.pts.size === 2) V.start = { d: dist(), s: V.s };
  else if (V.pts.size === 1) {
    V.start = { px: e.clientX, py: e.clientY, x: V.x, y: V.y }; V.swipeX = e.clientX;
    const now = Date.now();
    if (now - V.lastTap < 300) { V.s = V.s > 1 ? 1 : 2.5; applyZoom(); V.lastTap = 0; V.swipeX = null; }
    else V.lastTap = now;
  }
});
vwrap.addEventListener('pointermove', e => {
  if (!V.pts.has(e.pointerId)) return;
  V.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (V.pts.size === 2 && V.start && V.start.d) { V.s = Math.min(5, Math.max(1, V.start.s * dist() / V.start.d)); V.swipeX = null; applyZoom(); }
  else if (V.pts.size === 1 && V.s > 1 && V.start && V.start.px != null) { V.x = V.start.x + e.clientX - V.start.px; V.y = V.start.y + e.clientY - V.start.py; applyZoom(); }
});
function pointerEnd(e){
  if (!V.pts.has(e.pointerId)) return;
  V.pts.delete(e.pointerId);
  if (V.pts.size === 0 && V.s === 1 && V.swipeX != null && Math.abs(e.clientX - V.swipeX) > 60) stepViewer(e.clientX < V.swipeX ? 1 : -1);
  if (V.pts.size === 1) { const p = [...V.pts.values()][0]; V.start = { px: p.x, py: p.y, x: V.x, y: V.y }; V.swipeX = null; }
  if (V.pts.size === 0) V.start = null;
}
vwrap.addEventListener('pointerup', pointerEnd);
vwrap.addEventListener('pointercancel', pointerEnd);
vwrap.addEventListener('wheel', e => { e.preventDefault(); V.s = Math.min(5, Math.max(1, V.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15))); applyZoom(); }, { passive: false });
viewer.addEventListener('close', () => { V.pts.clear(); vimg.removeAttribute('src'); });
document.addEventListener('keydown', e => { if (!viewer.open) return; if (e.key === 'ArrowRight') stepViewer(1); if (e.key === 'ArrowLeft') stepViewer(-1); });

    call('personAdd', { name, book: book === '__ny' ? '' : book, newBook, role: $('#ppRole').value }).then(() => { closeDlg(); toast(`${name} är tillagd. Kopiera länken och skicka den.`); }).catch(() => { el.disabled = false; el.textContent = 'Lägg till'; });
  },
  shareLink: el => { const p = personById(el.dataset.id); if (p) shareLink(p); },
  shareBook: () => openShareBook(''),
  readLinkCreate: () => createReadLink(false),
  readLinkShare: () => shareReadLink(),
  readLinkCopy: () => copyReadLink(),
  readLinkRenew: () => ask('Göra en ny läslänk? Den gamla slutar fungera för alla som har den.', 'Gör ny länk', () => createReadLink(true)),
  invite: el => {
    const name = $('#invName').value.trim(); if (!name) { $('#invName').focus(); return; }
    el.disabled = true; el.textContent = 'Bjuder in …';
    call('personAdd', { name, role: $('#invRole').value }).then(d => { toast(`${name} är inbjuden. Tryck på Dela länk och skicka den.`); openShareBook(d.result || ''); }).catch(() => { el.disabled = false; el.textContent = 'Bjud in'; });
  },
  newKey: el => { const p = personById(el.dataset.id); if (!p) return; const self = p.id === me().id;
    ask(self ? 'Ge dig själv en ny länk? Den gamla slutar fungera direkt, så du behöver lägga den nya på hemskärmen.' : `Ge ${p.name} en ny länk? Den gamla slutar fungera direkt.`, 'Ny länk', () => call('personNewKey', { id: p.id }).then(() => { const n = personById(p.id); if (self && n) KEY = n.key; toast(`Ny länk skapad. Kopiera den och skicka till ${self ? 'dig själv' : p.name}.`); })); },
  delPerson: el => { const p = personById(el.dataset.id); if (!p) return; ask(`Ta bort ${p.name}? Länken slutar fungera. Kokboken och recepten finns kvar.`, 'Ta bort', () => call('personDelete', { id: p.id }).then(() => toast(`${p.name} är borttagen.`))); },
  addBook: () => openBookName(null),
  renameBook: el => openBookName(D.books.find(b => b.id === el.dataset.id)),
  saveBook: el => { const name = $('#bkName').value.trim(); if (!name) { $('#bkName').focus(); return; } const id = el.dataset.id; closeDlg(); call(id ? 'bookRename' : 'bookAdd', id ? { id, name } : { name }).then(() => toast(id ? 'Namnet är ändrat.' : `Kokboken ${name} är skapad.`)); },
  confirmNo: () => { $('#confirm').close(); confirmFn = null; },
  confirmYes: () => { $('#confirm').close(); const f = confirmFn; confirmFn = null; f && f(); }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && A[el.dataset.act]) { e.preventDefault(); A[el.dataset.act](el); } });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.shop) { const x = D.shop.find(i => i.id === t.dataset.shop); if (x) { x.done = t.checked; render(); call('shopToggle', { id: x.id, done: x.done }); } }
  if (t.dataset.role) { const p = personById(t.dataset.role); if (p) { p.role = t.value; call('personRole', { id: p.id, role: t.value }).then(() => toast(`${p.name}: ${ROLE_NAMES[t.value].toLowerCase()}.`)).catch(() => { if (dlgCtx.share) openShareBook(''); }); } }
  if (t.dataset.shelfi != null && S.shelfImp) { S.shelfImp.items[Number(t.dataset.shelfi)].skip = !t.checked; drawShelfImport(); }
  if (t.dataset.sugbook) { const p = sugPrefs(), id = t.dataset.sugbook; p.books = p.books.filter(x => x !== id).concat(t.checked ? [id] : []); setSugPrefs(p); S.home.seen = []; redrawSuggestion(true); }

  if (t.dataset.reccat) { const p = recPrefs(); p.hide = p.hide.filter(c => c !== t.dataset.reccat).concat(t.checked ? [] : [t.dataset.reccat]); setRecPrefs(p); S.showHidden = false; render(); }
  if (t.dataset.tabpref) { const h = hiddenTabs().filter(k => k !== t.dataset.tabpref).concat(t.checked ? [] : [t.dataset.tabpref]); try { localStorage.setItem('kokboken-flikar', JSON.stringify(h)); } catch (e) {} if (D.prefs) D.prefs['kokboken-flikar'] = JSON.stringify(h); pushPrefs(); render(); }
  if (t.dataset.vismode) saveVis(t.dataset.vismode);
  if (t.dataset.visof) saveVis(t.dataset.visof);
  if (t.id === 'ppBook') { $('#ppNewWrap').style.display = t.value === '__ny' ? '' : 'none'; if (t.value === '__ny') $('#ppNew').focus(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'eTags') drawTagChips();
  if (t.id === 'search') { S.q = t.value; $('#list').innerHTML = listItems(); saveState(); }
  /* Reglaget visar bara värdet. Filtreringen börjar när man trycker Tillämpa. */
  if (t.id === 'shelfName') drawCoverRow();
  if (t.id === 'pdSearch') $('#pdList').innerHTML = pickList(t.value);
  if (t.id === 'impText' && looksLikeUrl(t.value)) { $('#impBtn').disabled = true; $('#impInfo').innerHTML = 'Det här är en länk. <button class="link" data-act="importUrl">Hämta receptet från sidan</button>'; return; }
  if (t.id === 'impText') { let d = null; try { d = parseImport(t.value); } catch (err) {} $('#impBtn').disabled = !d || (!d.recipes.length && !d.totest.length); $('#impInfo').textContent = !t.value.trim() ? '' : d ? `Hittade ${d.recipes.length} recept och ${d.totest.length} idéer.` : 'Texten går inte att läsa. Kontrollera att hela texten från Claude är med.'; }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'editForm') saveEditor(e.target);
  if (e.target.id === 'chatForm') sendChef();  if (e.target.id === 'shopForm') { const v = $('#shopInput').value.trim(); if (!v) return; call('shopAdd', { items: [{ name: v, group: guessGroup(v) }] }); D.shop.push({ id: 'tmp' + Date.now(), name: v, group: guessGroup(v), done: false }); render(); setTimeout(() => $('#shopInput') && $('#shopInput').focus(), 0); }
});
setInterval(() => { if (document.visibilityState === 'visible' && S.tab === 'shop' && pending === 0 && !dlg.open) load(); }, 45000);

/* Servern skickar med datan i sidan (window.__KB), så appen visas direkt. Ett vanligt anrop hämtar sedan det senaste och läser inkorgen. */
if (window.__KB && window.__KB.me) { D = window.__KB; T.srv = D.timing; loaded = true; window.__kbLoaded = true; lastLoad = Date.now(); restorePrefs(); }
render();
google.script.url.getLocation(loc => {
  KEY = (loc && loc.parameter && loc.parameter.k) || '';
  if (KEY) load(); else showNoKey();
});
})();
</script>
<script>
/* Nya appen (B1): körs på startsidan i stället för hos Google. Byggs in i startsida/app.html av verktyg/bygg-ny.mjs.
 * Den ersätter google.script.run med fetch mot appens doPost, visar senast sparade data direkt ur telefonen (IndexedDB)
 * och startar sedan appens vanliga skript (som ligger som text i #kbmain), precis som hos Google. */
(function () {
  var P = new URLSearchParams(location.search);
  var SERVRAR = {
    skarp: 'https:' + '//script.google.com/macros/s/AKfycbxS5yofpzcw7tum_f3_0I-agP7ihwDkXchDMKBx2XolBaIsIFumfKfmXZO0UQvEnqYz/exec',
    test: 'https:' + '//script.google.com/macros/s/AKfycbwaCckzq2T4fowOAwCo_EbM-dzVGhlcOoAx51GtiJYdIGKQQ-sMHBZU1Apn_YiITPx6nQ/exec'
  };
  var SRV = SERVRAR[P.get('srv')] ? P.get('srv') : 'skarp';
  var KEY = P.get('k') || '';
  var NO_KEY = 'Be Victor eller Lovisa om din länk.';
  var HERO = 'kokboken-bild-' + SRV;

  /* ---------- Sparad data i telefonen (IndexedDB), en post per server. Nyckeln sparas med, så att en annan länk aldrig ser den. ---------- */
  function idb(mode, fn) {
    return new Promise(function (resolve) {
      var done = false;
      function end(v) { if (!done) { done = true; resolve(v); } }
      setTimeout(function () { end(null); }, 1500);
      try {
        var req = indexedDB.open('kokboken', 1);
        req.onupgradeneeded = function () { req.result.createObjectStore('data'); };
        req.onerror = function () { end(null); };
        req.onsuccess = function () {
          try {
            var tx = req.result.transaction('data', mode), q = fn(tx.objectStore('data'));
            tx.oncomplete = function () { end(q && q.result); };
            tx.onerror = tx.onabort = function () { end(null); };
          } catch (e) { end(null); }
        };
      } catch (e) { end(null); }
    });
  }
  function readCache() {
    return idb('readonly', function (st) { return st.get(SRV); }).then(function (v) { return v && v.k === KEY && v.d && v.d.me ? v.d : null; });
  }
  var saveTimer = null;
  function saveCache(d) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { idb('readwrite', function (st) { st.put({ k: KEY, d: d, t: Date.now() }, SRV); }); }, 600);
  }
  /* Länken gäller inte längre (ny nyckel eller borttagen person): ingenting får ligga kvar. */
  function clearCache() {
    clearTimeout(saveTimer);
    idb('readwrite', function (st) { st.delete(SRV); });
    try { localStorage.removeItem(HERO); } catch (e) {}
  }

  /* ---------- Anrop till servern ---------- */
  function post(fn, args) {
    return fetch(SERVRAR[SRV], { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args, k: KEY }) })
      .then(function (r) { return r.json().catch(function () { throw new Error('Servern svarade inte som väntat (' + r.status + ').'); }); },
        function () { throw new Error('Ingen kontakt med servern. Kontrollera nätet och försök igen.'); })
      .then(function (j) {
        if (j && j.fel != null) { if (String(j.fel).indexOf(NO_KEY) >= 0) clearCache(); throw new Error(j.fel); }
        return j ? j.ok : null;
      });
  }
  /* Samma form som google.script.run: withSuccessHandler, withFailureHandler och sedan funktionen. Appen skickar nyckeln sist; den tas bort och skickas i innehållet. */
  function runner() {
    var ok = function () {}, fail = function () {}, proxy;
    var r = {
      withSuccessHandler: function (f) { ok = f; return proxy; },
      withFailureHandler: function (f) { fail = f; return proxy; }
    };
    return proxy = new Proxy(r, {
      get: function (t, name) {
        if (name in t) return t[name];
        return function () {
          var args = Array.prototype.slice.call(arguments, 0, -1);
          post(name, args).then(function (d) { if (name === 'api' && d && d.me) saveCache(d); ok(d); }, function (e) { fail(e); });
        };
      }
    });
  }
  window.google = { script: { get run() { return runner(); }, url: { getLocation: function (cb) { cb({ parameter: { k: KEY } }); } } } };

  /* ---------- Start ---------- */
  function hero() { try { return localStorage.getItem(HERO); } catch (e) { return null; } }
  function putHero(src) {
    if (!src || document.getElementById('heroSrc')) return;
    var img = document.createElement('img');
    img.id = 'heroSrc'; img.hidden = true; img.alt = ''; img.src = src;
    document.body.appendChild(img);
  }
  function isStd(d) { var s = (d.books || []).filter(function (b) { return b.standard; })[0]; return !!s && d.me.book === s.id; }
  function runMain() {
    var s = document.getElementById('kbmain'), n = document.createElement('script');
    n.textContent = s.textContent;
    s.parentNode.replaceChild(n, s);
  }
  var t0 = performance.now();
  if (!KEY) { runMain(); return; }
  readCache().then(function (d) {
    if (d) {
      putHero(hero());
      d.timing = { telefon: true, data: Math.round(performance.now() - t0) };
      window.__KB = d;
      runMain();
      /* Bilden på Hem saknas i telefonen: hämta den till nästa start. */
      if (!hero() && isStd(d)) post('start', [{ hero: true }]).then(function (r) { if (r && r.hero) { try { localStorage.setItem(HERO, r.hero); } catch (e) {} } }, function () {});
      return;
    }
    post('start', [{ hero: !hero() }]).then(function (r) {
      if (r && r.hero) { try { localStorage.setItem(HERO, r.hero); } catch (e) {} }
      if (r && r.data && r.data.me) { window.__KB = r.data; saveCache(r.data); putHero(r.hero || hero()); }
      runMain();
    }, function () { runMain(); });
  });
})();
</script>
